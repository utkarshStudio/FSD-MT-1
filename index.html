<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="task-app">
      <header>
        <p class="eyebrow">My tasks</p>
        <h1>Task Manager</h1>
      </header>

      <form id="task-form" autocomplete="off">
        <label class="sr-only" for="task-input">New task</label>
        <input id="task-input" type="text" placeholder="What needs to be done?" maxlength="100" required />
        <button type="submit">Add task</button>
      </form>

      <div class="toolbar">
        <div class="filters" aria-label="Filter tasks">
          <button class="filter active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="active">Active</button>
          <button class="filter" type="button" data-filter="completed">Completed</button>
        </div>
        <button id="clear-completed" class="clear-button" type="button">Clear completed</button>
      </div>

      <p id="task-summary" class="summary" aria-live="polite"></p>
      <ul id="task-list" class="task-list"></ul>
    </main>

    <script src="script.js"></script>
  </body>
</html>
